# ----------- Sensor ----------- #
sensor:
  - platform:               modbus_controller
    name:                   ${name} Comfort Temperature ${channel_01_friendly_name}
    id:                     ${device}_comfort_temp_${channel_01_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x01
      - 0x05 # 05 = Floor temp
      - $channel_01_sensor
      - 0x01
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    lambda: |-
      // Raw register (scaled by the filter below), taken from the end of the reply payload.
      if (data.size() < 2) return NAN;
      uint16_t raw_temp = (uint16_t(data[data.size() - 2]) << 8) | data[data.size() - 1];
      ESP_LOGV("wavin", "Channel 01 floor temperature raw: %d", raw_temp);
      if (raw_temp == 0x7FFF) return NAN;  // Wavin: 0x7FFF = temperature not known
      return raw_temp;
    filters:
      - multiply: 0.1

# ----------- Number ----------- #
number:
  - platform:               modbus_controller
    name:                   ${name} Comfort Target Temperature ${channel_01_friendly_name}
    id:                     ${device}_comfort_target_temp_${channel_01_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x02
      - 0x01 # 01 = comfort
      - $channel_01
      - 0x01
    value_type: U_WORD
    unit_of_measurement: "°C"
    min_value: 6
    max_value: 40
    step: .5
    write_lambda: |-
      if (std::isnan(x)) return {};
      uint16_t targettemp = uint16_t(std::lround(x * 10.0f));  // 6..40 C -> 60..400
      ESP_LOGD("wavin", "Channel 01: writing comfort target temperature %.1f (raw %d)", x, targettemp);
      // 0x44 Write Register to Index: PACKED DATA (0x02), COMFORT TEMPERATURE (0x01), page = channel, 1 register
      const uint8_t pdu[] = {0x44, 0x02, 0x01, ${channel_01}, 0x01, uint8_t(targettemp >> 8), uint8_t(targettemp & 0xFF)};
      if (!item->queue_pdu(pdu)) { ESP_LOGW("wavin", "Channel 01: comfort target temperature write refused by the modbus hub"); }
      return {};
    lambda: |-
      if (data.size() < 2) return NAN;
      uint16_t raw_temp = (uint16_t(data[data.size() - 2]) << 8) | data[data.size() - 1];
      ESP_LOGV("wavin", "Channel 01 comfort target temperature raw: %d", raw_temp);
      return raw_temp * 0.1;

# ----------- Switch ----------- #
switch:
  - platform:               modbus_controller
    name:                   ${name} Comfort Standby ${channel_01_friendly_name}
    id:                     ${device}_comfort_standby_${channel_01_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x02
      - 0x07
      - $channel_01
      - 0x03
    write_lambda: |-
      ESP_LOGD("wavin", "Channel 01: comfort standby %s", ONOFF(x));
      // 0x45 Write Register Masked to Index: PACKED DATA (0x02), CONFIGURATION (0x07), page = channel, 1 register,
      // data 0x0001 (standby) / 0x0000 (manual), mask 0xFFF8 - the same frame as the channel's Standby switch.
      const uint8_t pdu[] = {0x45, 0x02, 0x07, ${channel_01}, 0x01, 0x00, uint8_t(x ? 0x01 : 0x00), 0xFF, 0xF8};
      if (!item->queue_pdu(pdu)) { ESP_LOGW("wavin", "Channel 01: comfort standby write refused by the modbus hub"); }
      return {};
    lambda: |-
      // 3 registers are read (CONFIGURATION, MIN, MAX): CONFIGURATION is the first, its low byte 5 bytes from the end.
      // MODE[2:0]: 0 manual, 1 standby, 2 eco, 3 comfort, 4 party, 5 holiday. Only 1 is standby.
      if (data.size() < 7) return item->state;  // byte count + 3 registers x 2 bytes
      uint8_t mode = data[data.size() - 5] & 0x07;
      ESP_LOGV("wavin", "Channel 01 mode: %d", mode);
      return mode == 1;

# ----------- Climate ----------- #
climate:
  - platform:               wavinahc9000v2
    name:                   ${name} Comfort ${channel_01_friendly_name}
    current_temp_sensor_id: ${device}_comfort_temp_${channel_01_id}
    target_temp_number_id:  ${device}_comfort_target_temp_${channel_01_id}
    mode_switch_sensor_id:  ${device}_comfort_standby_${channel_01_id}
    action_sensor_id:       ${device}_output_${channel_01_id}
