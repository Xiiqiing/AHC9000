# ----------- Sensor ----------- #
sensor:
  - platform:               modbus_controller
    name:                   ${name} Temperature ${channel_11_friendly_name}
    id:                     ${device}_temp_${channel_11_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x01
      - 0x04
      - $channel_11_sensor
      - 0x01
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    force_update: True
    lambda: |-
      // The register is the last 2 bytes of the reply payload, whatever header ESPHome leaves in `data`.
      if (data.size() < 2) return NAN;
      uint16_t raw_temp = (uint16_t(data[data.size() - 2]) << 8) | data[data.size() - 1];
      ESP_LOGV("wavin", "Channel 11 air temperature raw: %d", raw_temp);
      if (raw_temp == 0x7FFF) return NAN;  // Wavin: 0x7FFF = temperature not known
      return raw_temp * 0.1;
# ----------- Battery ----------- #
  - platform:               modbus_controller
    name:                   ${name} Battery ${channel_11_friendly_name}
    id:                     ${device}_battery_${channel_11_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x01
      - 0x0A
      - $channel_11_sensor
      - 0x01
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 1
    device_class: battery
    lambda: |-
      if (data.size() < 2) return NAN;
      uint16_t raw_battery = (uint16_t(data[data.size() - 2]) << 8) | data[data.size() - 1];
      ESP_LOGV("wavin", "Channel 11 battery raw: %d", raw_battery);
      return raw_battery * 10.0;
# ----------- Binary ----------- #
binary_sensor:
  - platform:               modbus_controller
    name:                   ${name} Output ${channel_11_friendly_name}
    id:                     ${device}_output_${channel_11_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x03
      - 0x00
      - $channel_11
      - 0x01
    bitmask: 0x0010
    lambda: |-
      // TIMER EVENT register, bit 4 (0x0010) = OUTP ON. Decoded here because the built-in bitmask is applied
      // to the first 2 bytes of `data`, which for a custom function code are header bytes, not the register.
      // Short reply: keep the last state (an empty optional would publish that built-in header-byte value).
      if (data.size() < 2) return item->state;
      return (data[data.size() - 1] & 0x10) != 0;
# ----------- Number ----------- #
number:
  - platform:               modbus_controller
    name:                   ${name} Target Temperature ${channel_11_friendly_name}
    id:                     ${device}_target_temp_${channel_11_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x02
      - 0x00
      - $channel_11
      - 0x01
    value_type: U_WORD
    unit_of_measurement: "°C"
    min_value: 6
    max_value: 40
    step: .5
    write_lambda: |-
      if (std::isnan(x)) return {};
      uint16_t targettemp = uint16_t(std::lround(x * 10.0f));  // 6..40 C -> 60..400
      ESP_LOGD("wavin", "Channel 11: writing target temperature %.1f (raw %d)", x, targettemp);
      // 0x44 Write Register to Index: PACKED DATA (0x02), MANUAL TEMPERATURE (0x00), page = channel, 1 register.
      // Sent to the modbus_controller's address (0x01), exactly like main's raw frame 01 44 02 00 ch 01 hi lo.
      const uint8_t pdu[] = {0x44, 0x02, 0x00, ${channel_11}, 0x01, uint8_t(targettemp >> 8), uint8_t(targettemp & 0xFF)};
      if (!item->queue_pdu(pdu)) { ESP_LOGW("wavin", "Channel 11: target temperature write refused by the modbus hub"); }
      return {};
    lambda: |-
      if (data.size() < 2) return NAN;
      uint16_t raw_temp = (uint16_t(data[data.size() - 2]) << 8) | data[data.size() - 1];
      ESP_LOGV("wavin", "Channel 11 target temperature raw: %d", raw_temp);
      return raw_temp * 0.1;
# ----------- Switch ----------- #
switch:
  - platform:               modbus_controller
    name:                   ${name} Standby ${channel_11_friendly_name}
    id:                     ${device}_standby_${channel_11_id}
    modbus_controller_id:   ${device}_modbus_controller
    custom_pdu:
      - 0x43
      - 0x02
      - 0x07
      - $channel_11
      - 0x01
    write_lambda: |-
      ESP_LOGD("wavin", "Channel 11: standby %s", ONOFF(x));
      // 0x45 Write Register Masked to Index: PACKED DATA (0x02), CONFIGURATION (0x07), page = channel, 1 register,
      // data 0x0001 (standby) / 0x0000 (manual), mask 0xFFF8 = only MODE[2:0] changes, every other bit is kept.
      const uint8_t pdu[] = {0x45, 0x02, 0x07, ${channel_11}, 0x01, 0x00, uint8_t(x ? 0x01 : 0x00), 0xFF, 0xF8};
      if (!item->queue_pdu(pdu)) { ESP_LOGW("wavin", "Channel 11: standby write refused by the modbus hub"); }
      return {};
    lambda: |-
      // CONFIGURATION register, MODE[2:0]: 0 manual, 1 standby, 2 eco, 3 comfort, 4 party, 5 holiday.
      // Only 1 is standby; the other modes keep heating.
      if (data.size() < 2) return item->state;
      uint8_t mode = data[data.size() - 1] & 0x07;
      ESP_LOGV("wavin", "Channel 11 mode: %d", mode);
      return mode == 1;
# ----------- Climate ----------- #
climate:
  - platform:               wavinahc9000v2
    name:                   ${name} ${channel_11_friendly_name}
    current_temp_sensor_id: ${device}_temp_${channel_11_id}
    target_temp_number_id:  ${device}_target_temp_${channel_11_id}
    mode_switch_sensor_id:  ${device}_standby_${channel_11_id}
    action_sensor_id:       ${device}_output_${channel_11_id}
